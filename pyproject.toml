[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

# ---------------------------------------------------------------------------
# Project metadata & runtime dependencies
# ---------------------------------------------------------------------------
[project]
name = "aiplatform"
version = "0.3.0"
description = "Enterprise AI assistant platform — Clean Architecture core with a provider-agnostic LLM port."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kishorhari" }]
keywords = [
    "clean-architecture",
    "hexagonal-architecture",
    "ports-and-adapters",
    "llm",
    "ollama",
    "fastapi",
    "pydantic",
    "structlog",
    "ai-platform",
]

# Runtime deps only. Per ADR-0002 nothing above the infrastructure layer may
# import a vendor SDK or httpx; these libraries are wired strictly behind ports.
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "httpx>=0.27",
    "uvicorn[standard]>=0.30",
    # Persistence (infrastructure only; ADR-0008). SQLAlchemy async core + Alembic
    # migrations are pure-Python. The asyncpg driver lives in the `postgres` extra
    # so local/dev installs never require a C toolchain; CI installs it explicitly.
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "aiosqlite>=0.20",
    "pgvector>=0.3",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
]
# The PostgreSQL async driver + pgvector SQLAlchemy integration. Required in
# production and in CI (pgvector service container); optional locally so a
# driverless dev box still installs cleanly.
postgres = [
    "asyncpg>=0.30",
    "pgvector>=0.3",
]

# ---------------------------------------------------------------------------
# Build target — src layout, single distributable package
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["src/aiplatform"]

# ---------------------------------------------------------------------------
# Ruff — lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F pyflakes+pycodestyle, I import sorting, N naming, UP pyupgrade,
# B bugbear, ANN annotations, D docstrings, ASYNC async-correctness, RUF ruff.
select = ["E", "F", "I", "N", "UP", "B", "ANN", "D", "ASYNC", "RUF"]
ignore = ["D203", "D213"] # mutually-exclusive docstring rules; pick the modern pair

[tool.ruff.lint.per-file-ignores]
# Tests favour readability over annotation/docstring ceremony.
"tests/**" = ["D", "ANN"]
"**/__init__.py" = ["D104"] # package docstring optional on namespace inits
# Alembic migrations are semi-generated; relax docstring/annotation/naming rules
# (revision filenames start with the revision id).
"migrations/**" = ["D", "ANN", "N999"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["aiplatform"]

# ---------------------------------------------------------------------------
# mypy — type checking. Strict on the pure inner layers (domain/application).
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
mypy_path = "src"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

# Inner layers are pure and cheap to type strictly — gaps here are unjustified
# (testing-strategy: domain/application target >= 95% coverage and full typing).
# pgvector is a Postgres-only extra (not installed on a driverless dev box); its
# SQLAlchemy integration ships no stubs. Treat its imports as untyped so mypy
# passes without it — the pgvector store is exercised only in CI.
[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["aiplatform.domain.*", "aiplatform.application.*"]
disallow_any_generics = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
warn_return_any = true
strict_equality = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: opt-in tests requiring a running Ollama instance (deselect with -m 'not live')",
    "postgres: repository contract run against a real PostgreSQL (CI service container; skipped without AIP__TEST_POSTGRES_DSN)",
]

# ---------------------------------------------------------------------------
# Coverage — diagnostic, not a hard gate (testing strategy). Targets ~95% on
# the pure inner layers (domain/application).
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["aiplatform"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
