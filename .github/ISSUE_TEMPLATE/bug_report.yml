name: Bug report
description: Report a defect in the AI Platform
title: "bug: <short description>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please do **not** report security
        vulnerabilities here — see [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps (and a code/config snippet if possible) to reproduce.
      placeholder: |
        1. Configure `AIP__LLM__DEFAULT_PROVIDER=...`
        2. Run `...`
        3. Observe `...`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error / traceback and relevant log lines (redact secrets).
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Affected provider
      options:
        - Echo
        - Ollama
        - Not provider-specific
        - Other / not sure
    validations:
      required: false
  - type: dropdown
    id: layer
    attributes:
      label: Suspected layer
      options:
        - domain
        - application
        - infrastructure
        - interface (http/cli)
        - composition
        - tooling / CI
        - not sure
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Tag (e.g. `v0.1.0-m1`) or commit SHA.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, Ollama version (if relevant).
      placeholder: "Windows 11, Python 3.13.1, Ollama 0.x"
    validations:
      required: false
