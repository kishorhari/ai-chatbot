name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check, dependency rule, tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package (with dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Gate order mirrors the git-strategy PR checklist:
      # lint -> type-check -> dependency rule -> tests.
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Type-check (mypy)
        run: mypy src

      - name: Dependency rule (import-linter)
        run: lint-imports

      # Live Ollama tests are opt-in and intentionally excluded from required CI.
      - name: Tests (unit + contract + respx integration)
        run: pytest -m "not live" --cov=aiplatform --cov-report=term-missing
